<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Page</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background: #FDFBF7; }
        button { padding: 15px 30px; font-size: 18px; background: #B8977F; color: white; border: none; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <h1 id="title">بەخێر بێیت زیلان</h1>
    <button onclick="testClick()">دوگمەکە بگرە</button>

    <script>
        function testClick() {
            document.getElementById('title').innerText = "دوگمەکە بە سەرکەوتوویی کار کرد!";
            alert("کار دەکات!");
        }
    </script>

</body>
</html>
