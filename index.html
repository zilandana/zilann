<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zilan's Basket</title>
    <style>
        body { font-family: Arial, sans-serif; background: #FDFBF7; padding: 20px; max-width: 600px; margin: auto; color: #2C2624; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background: #B8977F; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 16px; }
        button:hover { background: #9E7D65; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .delete-btn { background: #e74c3c; width: auto; padding: 5px 10px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>👜 سەبەتەی زیلان</h1>

    <div class="card">
        <h3>زیادکردنی شتی نوێ</h3>
        <input type="text" id="itemName" placeholder="ناوی شتەکە (بۆ نموونە: عەتر)">
        <input type="number" id="itemPrice" placeholder="نرخ ($)">
        <button onclick="addItem()">زدیکردنەوە (Add)</button>
    </div>

    <div class="card">
        <h3>لیستەکە</h3>
        <div id="itemsList"></div>
    </div>

    <script>
        let items = JSON.parse(localStorage.getItem('my_items')) || [];

        function render() {
            let container = document.getElementById('itemsList');
            container.innerHTML = '';
            
            if(items.length === 0) {
                container.innerHTML = '<p style="color: #7E7470;">هیچ شتێک نییە.</p>';
                return;
            }

            items.forEach((item, index) => {
                container.innerHTML += `
                    <div class="item-row">
                        <span><strong>${item.name}</strong> - $${item.price}</span>
                        <button class="delete-btn" onclick="deleteItem(${index})">سڕینەوە</button>
                    </div>
                `;
            });
        }

        function addItem() {
            let nameInput = document.getElementById('itemName');
            let priceInput = document.getElementById('itemPrice');

            if(!nameInput.value.trim()) {
                alert('تکایە ناوێک بنووسە!');
                return;
            }

            items.push({
                name: nameInput.value,
                price: priceInput.value || 0
            });

            localStorage.setItem('my_items', JSON.stringify(items));
            nameInput.value = '';
            priceInput.value = '';
            render();
        }

        function deleteItem(index) {
            items.splice(index, 1);
            localStorage.setItem('my_items', JSON.stringify(items));
            render();
        }

        // کارپێکردنی سەرەتایی
        render();
    </script>
</body>
</html>
