<div id="login-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#111;color:#fff;display:none;flex-direction:column;justify-content:center;align-items:center;z-index:9999;font-family:sans-serif;">
    <h3 style="margin-bottom: 15px;">PASSWORD/h3>
    <input type="password" id="pass-input" style="padding:12px;font-size:16px;border-radius:8px;border:1px solid #555;background:#222;color:#fff;margin-bottom:10px;text-align:center;outline:none;">
    <button onclick="checkPass()" style="padding:10px 20px;font-size:16px;background:#2ea043;color:white;border:none;border-radius:8px;cursor:pointer;">کردنەوەی ئەپ</button>
</div>

<script>
    // پشکنینی ئەوەی ئایا پێشتر ئەم مۆبایلە چوونەتە ژوورەوە یان نە
    if (localStorage.getItem("isLoggedIn") !== "true") {
        document.getElementById("login-screen").style.display = "flex";
    }

    function checkPass() {
        // لێرە لە شوێنی "1234" پاسوۆردی خۆت بنووسە
        let myPassword = "1998"; 
        let userEntered = document.getElementById("pass-input").value;
        
        if (userEntered === myPassword) {
            // پاشەکەوتکردنی دۆخەکە بۆ ئەوەی ئیتر لەسەر ئەم مۆبایلە داوای نەکاتەوە
            localStorage.setItem("isLoggedIn", "true");
            document.getElementById("login-screen").style.display = "none";
        } else {
            alert("Wrong Password");
        }
    }
</script>



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zilan Dana | PARK77 Project - Mechanical Site Engineer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap');

        :root {
            --primary-pink: #f8bbd0;
            --deep-rose: #ad1457;
            --luxury-gold: #d4af37;
            --soft-white: #fffafa;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --shadow: 0 8px 32px 0 rgba(173, 20, 87, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
            background-attachment: fixed;
            color: #4a148c;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
        }

        /* --- Layout --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 3rem 0;
            animation: fadeIn 1.2s ease-out;
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--deep-rose);
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1.1rem;
            color: var(--luxury-gold);
            text-transform: uppercase;
            font-weight: 600;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* --- Reusable Card Style --- */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary-pink);
            padding-bottom: 10px;
        }

        /* --- Buttons --- */
        .btn {
            background: linear-gradient(45deg, var(--deep-rose), #e91e63);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-size: 0.8rem;
            min-height: 44px;
        }

        .btn:hover {
            box-shadow: 0 5px 15px rgba(173, 20, 87, 0.4);
            filter: brightness(1.1);
        }

        .btn-gold {
            background: linear-gradient(45deg, var(--luxury-gold), #b8860b);
        }

        .btn-delete {
            background: #ff5252;
            padding: 5px 12px;
        }

        /* --- History / Archive --- */
        .history-bar {
            background: white;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            border: 1px solid var(--luxury-gold);
        }

        select {
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--primary-pink);
            outline: none;
        }

        /* --- Staff Management --- */
        .staff-list {
            list-style: none;
        }

        .staff-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #fce4ec;
        }

        .staff-info {
            flex-grow: 1;
            margin-right: 20px; /* Distance from checkbox */
        }

        .staff-checkbox {
            width: 25px;
            height: 25px;
            cursor: pointer;
            accent-color: var(--deep-rose);
        }

        /* --- Material Live Section --- */
        .market-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .market-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            border-left: 4px solid var(--luxury-gold);
            text-align: center;
        }

        .price-val {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2e7d32;
            display: block;
            margin: 5px 0;
        }

        .unit-tag {
            font-size: 0.7rem;
            background: #f3e5f5;
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* --- List Items Styling --- */
        .item-row {
            padding: 15px;
            border-bottom: 1px solid #eee;
            animation: slideIn 0.3s ease-out;
        }

        .item-row div { margin-bottom: 5px; }

        .editable-field {
            border: 1px dashed transparent;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .editable-field:hover {
            border-color: var(--primary-pink);
            background: rgba(255, 182, 193, 0.1);
        }

        /* --- Animations --- */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(-10px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* --- Input Styles --- */
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
        }

        .task-deadline {
            color: var(--deep-rose);
            font-weight: 600;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Zilan Dana</h1>
        <p>Mechanical Site Engineer | PARK77 Project</p>
    </header>

    <!-- History Archive Section -->
    <div class="history-bar">
        <label><strong>Project History Vault:</strong></label>
        <select id="historySelect">
            <option value="current">Current Workspace (Live)</option>
        </select>
        <button class="btn btn-gold" onclick="saveDaySnapshot()">Save Day Data Snapshot</button>
        <button class="btn" style="background: #555" onclick="deleteSelectedHistory()">Delete Snapshot</button>
    </div>

    <!-- Live Market Prices (Above sections as requested) -->
    <div class="card">
        <div class="card-header">
            <h3>Live Mechanical Market Prices</h3>
            <span id="updatePulse" style="color: #2e7d32; font-size: 0.8rem;">● Updating Live</span>
        </div>
        <div class="market-grid" id="marketGrid">
            <!-- Market cards generated by JS -->
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- Tasks Section -->
        <div class="card">
            <div class="card-header">
                <h3>Site Tasks & Deadlines</h3>
            </div>
            <div id="taskInputs">
                <input type="text" id="taskTitle" placeholder="Task Name (e.g., Boiler Inspection)">
                <input type="datetime-local" id="taskTime">
                <button class="btn" onclick="addTask()">Add Task</button>
            </div>
            <div id="taskList"></div>
        </div>

        <!-- Staff Attendance -->
        <div class="card">
            <div class="card-header">
                <h3>Staff Attendance Checklist</h3>
            </div>
            <div class="staff-list" id="staffList">
                <!-- Specific staffs requested -->
            </div>
        </div>

        <!-- Material Inventory/Ordering -->
        <div class="card">
            <div class="card-header">
                <h3>Material Ordering & Inventory</h3>
            </div>
            <div id="materialInputs">
                <input type="text" id="matName" placeholder="Material Name">
                <input type="text" id="matPrice" placeholder="Unit Price ($)">
                <select id="matUnit">
                    <option value="1 kg">per 1 kg</option>
                    <option value="1 oz">per 1 oz</option>
                    <option value="1 unit">per Unit</option>
                    <option value="1 meter">per Meter</option>
                </select>
                <button class="btn" onclick="addMaterial()">Add to List</button>
            </div>
            <div id="materialList"></div>
        </div>

        <!-- Problem Log -->
        <div class="card">
            <div class="card-header">
                <h3>System Problems Log</h3>
            </div>
            <div id="problemInputs">
                <select id="probSystem">
                    <option value="LPG">LPG</option>
                    <option value="HVAC">HVAC</option>
                    <option value="Plumbing">Plumbing</option>
                    <option value="Shovash">Underwater Heating (Shovash)</option>
                    <option value="Gizzer">Water Heating (Gizzer)</option>
                    <option value="Elevator">Elevator</option>
                    <option value="Ducts">Ducts & Covering</option>
                </select>
                <textarea id="probDesc" rows="2" placeholder="Describe the issue..."></textarea>
                <button class="btn" onclick="addProblem()">Log New Problem</button>
            </div>
            <div id="problemList"></div>
        </div>
    </div>
</div>

<script>
    // --- Initial State ---
    let siteData = {
        tasks: [],
        staff: [
            { name: 'LPG Team', present: false },
            { name: 'Elevator Team', present: false },
            { name: 'Plumbing Team', present: false },
            { name: 'Shovash Team', present: false },
            { name: 'Gizzer Team', present: false },
            { name: 'Covering & Ducts', present: false }
        ],
        materials: [],
        problems: []
    };

    const marketItems = [
        { name: 'Copper Pipe', unit: '1 meter', base: 12.5 },
        { name: 'Steel Sheet', unit: '1 kg', base: 4.8 },
        { name: 'Refrigerant', unit: '1 oz', base: 2.1 },
        { name: 'Insulation Foam', unit: '1 meter', base: 3.2 },
        { name: 'PVC Fitting', unit: '1 unit', base: 0.95 }
    ];

    // --- Core Persistence Functions ---
    function loadData() {
        const saved = localStorage.getItem('zilan_site_data');
        if (saved) siteData = JSON.parse(saved);
        
        const history = JSON.parse(localStorage.getItem('zilan_history') || '{}');
        const select = document.getElementById('historySelect');
        select.innerHTML = '<option value="current">Current Workspace (Live)</option>';
        Object.keys(history).forEach(date => {
            const opt = document.createElement('option');
            opt.value = date;
            opt.textContent = date;
            select.appendChild(opt);
        });
        
        renderAll();
    }

    function saveData() {
        localStorage.setItem('zilan_site_data', JSON.stringify(siteData));
    }

    function saveDaySnapshot() {
        const history = JSON.parse(localStorage.getItem('zilan_history') || '{}');
        const now = new Date().toLocaleString();
        history[now] = JSON.parse(JSON.stringify(siteData));
        localStorage.setItem('zilan_history', JSON.stringify(history));
        alert('Snapshot saved successfully for: ' + now);
        loadData();
    }

    function deleteSelectedHistory() {
        const select = document.getElementById('historySelect');
        const val = select.value;
        if (val === 'current') return;
        
        const history = JSON.parse(localStorage.getItem('zilan_history') || '{}');
        delete history[val];
        localStorage.setItem('zilan_history', JSON.stringify(history));
        loadData();
    }

    document.getElementById('historySelect').addEventListener('change', (e) => {
        if (e.target.value === 'current') {
            loadData();
        } else {
            const history = JSON.parse(localStorage.getItem('zilan_history') || '{}');
            siteData = history[e.target.value];
            renderAll(false); // Render without enabling live editing if historical? (Optional)
        }
    });

    // --- Feature Functions ---
    function addTask() {
        const title = document.getElementById('taskTitle').value;
        const time = document.getElementById('taskTime').value;
        if (!title) return;
        siteData.tasks.push({ id: Date.now(), title, time, completed: false });
        saveData();
        renderAll();
        document.getElementById('taskTitle').value = '';
    }

    function addMaterial() {
        const name = document.getElementById('matName').value;
        const price = document.getElementById('matPrice').value;
        const unit = document.getElementById('matUnit').value;
        if (!name) return;
        siteData.materials.push({ id: Date.now(), name, price, unit });
        saveData();
        renderAll();
        document.getElementById('matName').value = '';
        document.getElementById('matPrice').value = '';
    }

    function addProblem() {
        const sys = document.getElementById('probSystem').value;
        const desc = document.getElementById('probDesc').value;
        if (!desc) return;
        siteData.problems.push({ id: Date.now(), system: sys, desc });
        saveData();
        renderAll();
        document.getElementById('probDesc').value = '';
    }

    function deleteItem(arrayName, id) {
        siteData[arrayName] = siteData[arrayName].filter(item => item.id !== id);
        saveData();
        renderAll();
    }

    function updateEdit(arrayName, id, field, newVal) {
        const item = siteData[arrayName].find(i => i.id === id);
        if(item) {
            item[field] = newVal;
            saveData();
        }
    }

    function toggleStaff(index) {
        siteData.staff[index].present = !siteData.staff[index].present;
        saveData();
    }

    function addToCalendar(title, time) {
        if (!time) { alert("Please set a time first"); return; }
        const start = new Date(time).toISOString().replace(/-|:|\.\d+/g, "");
        const end = new Date(new Date(time).getTime() + 3600000).toISOString().replace(/-|:|\.\d+/g, "");
        const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${title}\nDTSTART:${start}\nDTEND:${end}\nEND:VEVENT\nEND:VCALENDAR`;
        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute('download', 'task-reminder.ics');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // --- Market Engine ---
    function updateMarket() {
        const grid = document.getElementById('marketGrid');
        grid.innerHTML = '';
        marketItems.forEach(item => {
            const currentPrice = (item.base + (Math.random() * 2 - 1)).toFixed(2);
            grid.innerHTML += `
                <div class="market-card">
                    <small>${item.name}</small>
                    <span class="price-val">$${currentPrice}</span>
                    <span class="unit-tag">per ${item.unit}</span>
                </div>
            `;
        });
    }

    // --- Rendering Engine ---
    function renderAll() {
        // Tasks
        const taskList = document.getElementById('taskList');
        taskList.innerHTML = '';
        siteData.tasks.forEach(t => {
            taskList.innerHTML += `
                <div class="item-row">
                    <div contenteditable="true" onblur="updateEdit('tasks', ${t.id}, 'title', this.innerText)" class="editable-field">${t.title}</div>
                    <div class="task-deadline">Deadline: ${t.time || 'Not set'}</div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="btn btn-gold" onclick="addToCalendar('${t.title}', '${t.time}')">Add to iPhone</button>
                        <button class="btn btn-delete" onclick="deleteItem('tasks', ${t.id})">Delete</button>
                    </div>
                </div>
            `;
        });

        // Staff
        const staffList = document.getElementById('staffList');
        staffList.innerHTML = '';
        siteData.staff.forEach((s, index) => {
            staffList.innerHTML += `
                <div class="staff-item">
                    <div class="staff-info">${s.name}</div>
                    <input type="checkbox" class="staff-checkbox" ${s.present ? 'checked' : ''} onchange="toggleStaff(${index})">
                </div>
            `;
        });

        // Materials
        const materialList = document.getElementById('materialList');
        materialList.innerHTML = '';
        siteData.materials.forEach(m => {
            materialList.innerHTML += `
                <div class="item-row">
                    <div contenteditable="true" onblur="updateEdit('materials', ${m.id}, 'name', this.innerText)" class="editable-field"><strong>${m.name}</strong></div>
                    <div>Price: <span contenteditable="true" onblur="updateEdit('materials', ${m.id}, 'price', this.innerText)">${m.price}</span> per ${m.unit}</div>
                    <button class="btn btn-delete" style="margin-top: 5px;" onclick="deleteItem('materials', ${m.id})">Delete</button>
                </div>
            `;
        });

        // Problems
        const problemList = document.getElementById('problemList');
        problemList.innerHTML = '';
        siteData.problems.forEach(p => {
            problemList.innerHTML += `
                <div class="item-row">
                    <div style="color: var(--deep-rose); font-weight: bold;">[${p.system}]</div>
                    <div contenteditable="true" onblur="updateEdit('problems', ${p.id}, 'desc', this.innerText)" class="editable-field">${p.desc}</div>
                    <button class="btn btn-delete" style="margin-top: 5px;" onclick="deleteItem('problems', ${p.id})">Delete</button>
                </div>
            `;
        });
    }

    // Init
    setInterval(updateMarket, 2000);
    updateMarket();
    loadData();
</script>

</body>
</html>
